<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Científica - Día/Noche</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <div class="calculator">
      <header class="calc-header">
        <h1 class="title">Calculadora</h1>
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
          <span id="theme-icon">🌙</span>
        </button>
      </header>

      <div class="display">
        <div id="history" class="history"></div>
        <div id="output" class="output">0</div>
      </div>

      <div class="keys">
        <!-- Fila científica 1 -->
        <button class="key sci" data-action="func" data-func="sin">sin</button>
        <button class="key sci" data-action="func" data-func="cos">cos</button>
        <button class="key sci" data-action="func" data-func="tan">tan</button>
        <button class="key sci" data-action="func" data-func="log">log</button>
        <button class="key sci" data-action="func" data-func="ln">ln</button>

        <!-- Fila científica 2 -->
        <button class="key sci" data-action="square">x²</button>
        <button class="key sci" data-action="power">x^y</button>
        <button class="key sci" data-action="sqrt">√</button>
        <button class="key sci" data-action="const" data-const="pi">π</button>
        <button class="key sci" data-action="const" data-const="e">e</button>

        <!-- Fila científica 3 -->
        <button class="key sci" data-action="factorial">n!</button>
        <button class="key sci" data-action="paren" data-paren="(">(</button>
        <button class="key sci" data-action="paren" data-paren=")">)</button>
        <button class="key util" data-action="clear">C</button>
        <button class="key util" data-action="backspace">⌫</button>

        <!-- Fila numérica -->
        <button class="key num" data-action="num" data-num="7">7</button>
        <button class="key num" data-action="num" data-num="8">8</button>
        <button class="key num" data-action="num" data-num="9">9</button>
        <button class="key op" data-action="op" data-op="/">÷</button>
        <button class="key op" data-action="op" data-op="*">×</button>

        <button class="key num" data-action="num" data-num="4">4</button>
        <button class="key num" data-action="num" data-num="5">5</button>
        <button class="key num" data-action="num" data-num="6">6</button>
        <button class="key op" data-action="op" data-op="-">−</button>
        <button class="key op" data-action="op" data-op="+">+</button>

        <button class="key num" data-action="num" data-num="1">1</button>
        <button class="key num" data-action="num" data-num="2">2</button>
        <button class="key num" data-action="num" data-num="3">3</button>
        <button class="key num" data-action="num" data-num="0">0</button>
        <button class="key num" data-action="dot">.</button>

        <button class="key equals" data-action="equals">=</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
